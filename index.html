:root { --ivory:#F8F4EF; --bezs:#E9DFD3; --dio:#492A13; --halk:#6E5240; --vonal:#C9B5A1; --teve:#8F7762;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif; --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ivory); color: var(--dio); }
body { font: 400 17px/1.65 var(--body); min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
h1, p { margin: 0; }
a { color: inherit; text-underline-offset: 4px; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.wrap { max-width: 1100px; margin-inline: auto; padding-inline: max(20px, env(safe-area-inset-left, 0px)); }
@media (min-width: 700px) { .wrap { padding-inline: 48px; } }
header { background: var(--bezs); border-bottom: 1px solid var(--vonal); }
header .wrap { padding-block: 1.25rem; }
.logo { display: block; width: 136px; height: auto; }
main .wrap { display: grid; gap: 2.5rem; align-items: center; padding-block: clamp(2.5rem, 7vw, 5.5rem); }
main .wrap > * { min-width: 0; }
@media (min-width: 820px) { main .wrap { grid-template-columns: 6fr 5fr; gap: 5rem; } }
.copy { display: grid; gap: 1.4rem; justify-items: start; }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
h1 { font: 500 clamp(2.6rem, 6.5vw, 4.8rem)/1.06 var(--display); font-variation-settings: "opsz" 24; text-wrap: balance; }
h1 em { font-weight: 400; }
.lead { font-size: 1.1875rem; max-width: 30em; }
.muted { color: var(--halk); }
.tag { display: inline-block; background: var(--ivory); font-size: .7rem; font-weight: 600; letter-spacing: .08em; padding: .4rem .7rem; outline: 1px dashed var(--teve); outline-offset: -3px; }
.contact { display: grid; gap: .9rem; padding-top: 1.4rem; border-top: 1px solid var(--vonal); width: 100%; }
.social { display: flex; flex-wrap: wrap; gap: .6rem; }
.social a { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border: 1px solid var(--dio); border-radius: 50%; }
.social a:hover { background: var(--dio); color: var(--ivory); }
.social svg { width: 1.3rem; height: 1.3rem; display: block; }
figure { margin: 0; display: grid; gap: .75rem; justify-items: center; }
.frame { position: relative; background: var(--bezs); padding: 14px; width: min(100%, 420px); }
.frame::after { content: ""; position: absolute; inset: 7px; border: 1px dashed var(--teve); pointer-events: none; }
.frame img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; }
figcaption { font: italic 400 1.05rem/1.4 var(--display); color: var(--halk); text-align: center; }
footer { font-size: .85rem; color: var(--halk); }
footer .wrap { padding-block: 1.5rem; border-top: 1px solid var(--vonal); }
</style>
